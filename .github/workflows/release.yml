name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      solution:
        description: 'Build configuration'
        required: true
        default: 'RelWithDebInfo'
        type: string
      artifact:
        description: 'Upload to artifact'
        required: false
        default: true
        type: boolean
      release:
        description: 'Create a release'
        required: false
        default: true
        type: boolean
      pre_release:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      rel_tag:
        description: 'Release tag (e.g. 2.3.0)'
        required: false
        default: ''
        type: string
      rel_title:
        description: 'Release title'
        required: false
        default: ''
        type: string
      rel_desc:
        description: 'Release description'
        required: false
        default: ''
        type: string

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag_name: ${{ steps.rel_info.outputs.tag_name }}
      title: ${{ steps.rel_info.outputs.title }}
      desc_body: ${{ steps.rel_info.outputs.desc_body }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set release info
        id: rel_info
        env:
          INPUT_TAG: ${{ inputs.rel_tag }}
          INPUT_TITLE: ${{ inputs.rel_title }}
          INPUT_DESC: ${{ inputs.rel_desc }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::push tag must be vX.Y.Z (received '$GITHUB_REF_NAME')"
              exit 1
            fi
            title="v$tag"
            current_ref="$GITHUB_SHA"
            previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          else
            tag="${INPUT_TAG#v}"
            if [ -z "$tag" ]; then
              if [ "$INPUT_RELEASE" = "true" ]; then
                echo "::error::rel_tag is required when release creation is enabled"
                exit 1
              fi
            elif ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::rel_tag must be x.y.z, with an optional leading v (received '$INPUT_TAG')"
              exit 1
            fi
            title="${INPUT_TITLE:-v$tag}"
            current_ref="$GITHUB_SHA"
            previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_SHA" 2>/dev/null || true)"
            if [ -n "$INPUT_DESC" ]; then
              desc="$INPUT_DESC"
            fi
          fi

          if [ -z "${desc:-}" ]; then
            notes_path="docs/releases/v$tag.md"
            if [ -f "$notes_path" ]; then
              desc="$(cat "$notes_path")"
            else
              if [ -n "$previous_tag" ]; then
                range="$previous_tag..$current_ref"
                heading="## Changes from $previous_tag to v$tag"
              else
                range="$current_ref"
                heading="## Changes in v$tag"
              fi
              changes="$(git log --pretty=format:'- %s (`%h`)' "$range")"
              desc="$(printf '%s\n\n%s' "$heading" "$changes")"
            fi
          fi

          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          delimiter="release_desc_$(date +%s%N)"
          echo "desc_body<<$delimiter" >> "$GITHUB_OUTPUT"
          echo "$desc" >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"

  build-win:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install LLVM and Ninja
        run: choco install llvm ninja --no-progress

      - name: Build
        shell: pwsh
        env:
          BUILD_TYPE: ${{ inputs.solution || 'RelWithDebInfo' }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag_name }}
        run: |
          $cmakeArgs = @(
            '-G', 'Ninja',
            '-DCMAKE_C_COMPILER=clang-cl',
            "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE",
            '-S', '.',
            '-B', 'build'
          )
          if ($env:RELEASE_TAG) {
            $cmakeArgs += "-DMP_VERSION=$env:RELEASE_TAG"
          }
          cmake @cmakeArgs
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Test debug command build
        shell: pwsh
        env:
          BUILD_TYPE: ${{ inputs.solution || 'RelWithDebInfo' }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag_name }}
        run: |
          $cmakeArgs = @(
            '-G', 'Ninja',
            '-DCMAKE_C_COMPILER=clang-cl',
            "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE",
            '-DENABLE_MPV_DEBUG_COMMANDS=ON',
            '-S', '.',
            '-B', 'build-debug-commands'
          )
          if ($env:RELEASE_TAG) {
            $cmakeArgs += "-DMP_VERSION=$env:RELEASE_TAG"
          }
          cmake @cmakeArgs
          cmake --build build-debug-commands --parallel
          ctest --test-dir build-debug-commands --output-on-failure

      - name: Upload Windows files
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            build/endstone_mediaplayer.dll
            build/endstone_mediaplayer.pdb
          retention-days: 1

  build-linux:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install LLVM and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ninja-build
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20

      - name: Build
        env:
          BUILD_TYPE: ${{ inputs.solution || 'RelWithDebInfo' }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag_name }}
        run: |
          cmake_args=(
            -G Ninja
            -DCMAKE_C_COMPILER=clang-20
            -DCMAKE_CXX_COMPILER=clang++-20
            "-DCMAKE_BUILD_TYPE=$BUILD_TYPE"
            -S .
            -B build
          )
          if [ -n "$RELEASE_TAG" ]; then
            cmake_args+=("-DMP_VERSION=$RELEASE_TAG")
          fi
          cmake "${cmake_args[@]}"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Test debug command build
        env:
          BUILD_TYPE: ${{ inputs.solution || 'RelWithDebInfo' }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag_name }}
        run: |
          cmake_args=(
            -G Ninja
            -DCMAKE_C_COMPILER=clang-20
            -DCMAKE_CXX_COMPILER=clang++-20
            "-DCMAKE_BUILD_TYPE=$BUILD_TYPE"
            -DENABLE_MPV_DEBUG_COMMANDS=ON
            -S .
            -B build-debug-commands
          )
          if [ -n "$RELEASE_TAG" ]; then
            cmake_args+=("-DMP_VERSION=$RELEASE_TAG")
          fi
          cmake "${cmake_args[@]}"
          cmake --build build-debug-commands --parallel
          ctest --test-dir build-debug-commands --output-on-failure

      - name: Upload Linux files
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: build/endstone_mediaplayer.so
          retention-days: 1

  build-python:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install release checks
        run: python -m pip install --disable-pip-version-check ruff

      - name: Run package tests
        run: python tests/test_package_release.py

      - name: Compile release Python files
        run: python -m compileall -q python/endstone_mediaplayer examples tools/package_release.py

      - name: Run Ruff
        run: ruff check --select E4,E7,E9,F python/endstone_mediaplayer examples/basic_screen.py tools/package_release.py

      - name: Build wheel
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir wheel python/
          test "$(find wheel -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test -f "wheel/endstone_mediaplayer-0.1.0-py3-none-any.whl"

      - name: Test wheel import
        shell: bash
        run: |
          python -m pip install --no-deps --target wheel-smoke \
            wheel/endstone_mediaplayer-0.1.0-py3-none-any.whl
          PYTHONPATH=wheel-smoke python -c \
            'import endstone_mediaplayer; assert callable(endstone_mediaplayer.mediaplayer)'

      - name: Upload Python wheel
        uses: actions/upload-artifact@v7
        with:
          name: release-python
          path: wheel/endstone_mediaplayer-0.1.0-py3-none-any.whl
          retention-days: 1

  release:
    needs: [prepare, build-win, build-linux, build-python]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release files
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Package release
        run: |
          python tools/package_release.py \
            --windows-dll release/endstone_mediaplayer.dll \
            --windows-pdb release/endstone_mediaplayer.pdb \
            --linux-so release/endstone_mediaplayer.so \
            --wheel release/endstone_mediaplayer-0.1.0-py3-none-any.whl \
            --source-root . \
            --output-dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: github.event_name == 'push' || inputs.artifact
        with:
          name: endstone_mediaplayer-release
          path: |
            dist/endstone_mediaplayer-windows-x64.zip
            dist/endstone_mediaplayer-linux-x64.tar.gz
            dist/endstone_mediaplayer-sdk.zip
          retention-days: 1

      - name: Create release
        uses: softprops/action-gh-release@v3.0.2
        if: github.event_name == 'push' || inputs.release
        with:
          tag_name: v${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.title }}
          prerelease: ${{ github.event_name == 'push' && false || inputs.pre_release }}
          body: ${{ needs.prepare.outputs.desc_body }}
          fail_on_unmatched_files: true
          files: |
            dist/endstone_mediaplayer-windows-x64.zip
            dist/endstone_mediaplayer-linux-x64.tar.gz
            dist/endstone_mediaplayer-sdk.zip
